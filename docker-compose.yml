services:
  # ==========================================
  # In-Memory Cache & Native Price Filter
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hotel-orchestrator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # Temporal All-In-One Dev Server & Web UI
  # ==========================================
  temporal:
    image: temporalio/temporal:latest
    container_name: hotel-orchestrator-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233" # gRPC server
      - "8233:8233" # Web UI dashboard
    volumes:
      - temporal-data:/data
    restart: unless-stopped

  # ==========================================
  # Hotel Offer Orchestrator API Gateway
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-orchestrator-api
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=HOTEL_OFFER_TASK_QUEUE
      - SUPPLIER_A_URL=http://localhost:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://localhost:3000/supplierB/hotels
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # Temporal Distributed Worker
  # ==========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-orchestrator-worker
    command: ["node", "dist/temporal/worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=HOTEL_OFFER_TASK_QUEUE
      - SUPPLIER_A_URL=http://api:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://api:3000/supplierB/hotels
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  temporal-data:
